[build]
  functions = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.google.com https://www.gstatic.com https://fonts.googleapis.com https://fonts.gstatic.com https://raw.githubusercontent.com https://fs.getcourse.ru https://rutube.ru https://vk.ru https://t.me https://max.ru data: blob:;"
[[redirects]]
  from = "/Mk1plod"
  to = "/mk/Mk1plod.html"
  status = 200

[[redirects]]
  from = "/Mk2dekor"
  to = "/mk/Mk2dekor.html"
  status = 200

[[redirects]]
  from = "/Mk3posad"
  to = "/mk/Mk3posad.html"
  status = 200

[[redirects]]
  from = "/Mk4kal"
  to = "/mk/Mk4kal.html"
  status = 200

[[redirects]]
  from = "/Mk5priv"
  to = "/mk/Mk5priv.html"
  status = 200

[[redirects]]
  from = "/api/payment-webhook"
  to = "/.netlify/functions/payment-webhook"
  status = 200
