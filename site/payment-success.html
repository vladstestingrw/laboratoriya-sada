<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Оплата прошла успешно — Лаборатория сада</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,700&family=Raleway:wght@400;700&display=swap" rel="stylesheet">
<style>
body { font-family: 'Raleway', sans-serif; background: #F7F3EC; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
.box { background: #fff; border-radius: 12px; padding: 56px 48px; max-width: 480px; text-align: center; box-shadow: 0 8px 40px rgba(28,61,34,0.1); }
.icon { font-size: 56px; margin-bottom: 20px; }
h1 { font-family: 'Cormorant Garamond', serif; font-size: 36px; color: #1C3D22; margin-bottom: 12px; }
p { font-size: 15px; color: #6B7868; line-height: 1.7; margin-bottom: 24px; }
.btn { display: inline-block; background: #2E6B38; color: #fff; padding: 14px 32px; border-radius: 4px; text-decoration: none; font-weight: 700; font-size: 14px; letter-spacing: 1px; text-transform: uppercase; }
.test-badge { display: inline-block; background: #FFF3CD; color: #856404; padding: 6px 14px; border-radius: 4px; font-size: 12px; font-weight: 700; margin-bottom: 20px; }
</style>
</head>
<body>
<div class="box">
  <div class="icon">✅</div>
  <div id="testBadge"></div>
  <h1>Оплата прошла!</h1>
  <p>Спасибо за покупку. Доступ к материалам откроется в течение нескольких минут. Проверьте вашу почту — мы отправим письмо со ссылкой для входа.</p>
  <a href="/" class="btn">На главную</a>
</div>
<script>
const params = new URLSearchParams(window.location.search);
if (params.get('test') === 'true') {
  document.getElementById('testBadge').innerHTML = '<div class="test-badge">⚠️ Тестовый режим — реальная оплата не произведена</div>';
}
</script>
</body>
</html>
